openapi: 3.0.3
info:
  title: POSApp Order Intake API
  version: 1.0.0
  license:
    name: ISC
  description: >-
    Builds server-authoritative quotes and creates hold-only phone orders for cashier review.
    This API cannot take payment, check out, print, or send an order to the kitchen.
servers:
  - url: https://your-pos.example/api/order-intake/v1
security:
  - bearerAuth: []
paths:
  /status:
    get:
      operationId: getOrderIntakeStatus
      summary: Verify the integration and its hold-only capability
      responses:
        '200':
          description: Integration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /order-types:
    get:
      operationId: listOrderTypes
      summary: List order types allowed for external intake
      responses:
        '200':
          description: Active order types
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, order_types]
                properties:
                  success: { type: boolean, enum: [true] }
                  order_types:
                    type: array
                    items: { $ref: '#/components/schemas/OrderType' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /catalog/search:
    get:
      operationId: searchCatalog
      summary: Search the current sellable catalog
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: Bounded product results with current server prices
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, products]
                properties:
                  success: { type: boolean, enum: [true] }
                  products:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/Product' }
                  unavailable_products:
                    type: array
                    maxItems: 3
                    description: Explicitly disabled matches, returned when no sellable match exists. Never order these IDs.
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        category: { type: string, nullable: true }
                        available: { type: boolean, enum: [false] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /catalog/browse:
    get:
      operationId: browseCatalog
      summary: Browse active menu categories or one category's sellable products in bounded pages
      parameters:
        - name: category_id
          in: query
          required: false
          description: Omit to list categories; provide an active category id to list its products.
          schema: { type: integer, minimum: 1 }
        - name: cursor
          in: query
          required: false
          description: Last category or product id from the previous next_cursor.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: A bounded discovery page; chosen products must still be resolved through catalog search before quoting.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CategoryBrowseResponse'
                  - $ref: '#/components/schemas/ProductBrowseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /customers/lookup:
    post:
      operationId: lookupCustomerByPhone
      summary: Find an existing customer by an exact normalized phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, minLength: 1, maxLength: 40 }
      responses:
        '200':
          description: One customer or null
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, customer]
                properties:
                  success: { type: boolean, enum: [true] }
                  customer:
                    type: object
                    allOf:
                      - $ref: '#/components/schemas/CustomerMatch'
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /requests/{external_request_id}:
    get:
      operationId: lookupOrderIntakeRequest
      summary: Reconcile an earlier create attempt without creating an order
      parameters:
        - name: external_request_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{8,128}$'
      responses:
        '200':
          description: The durable create result, or null when no create committed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, request]
                properties:
                  success: { type: boolean, enum: [true] }
                  request:
                    type: object
                    allOf:
                      - $ref: '#/components/schemas/HeldOrderResult'
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /quotes:
    post:
      operationId: quoteHeldOrder
      summary: Validate and price an order draft using current POS authority
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderDraft' }
      responses:
        '200':
          description: Short-lived signed quote to read back to the customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /held-orders:
    post:
      operationId: createConfirmedHeldOrder
      summary: Create one hold-only order after explicit customer confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [draft, quote_token, confirmed]
              properties:
                draft: { $ref: '#/components/schemas/OrderDraft' }
                quote_token: { type: string, minLength: 20 }
                confirmed:
                  type: boolean
                  enum: [true]
                  description: Set only after the customer confirms the quoted order and total.
      responses:
        '200':
          description: Newly created hold or an idempotent replay
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, held_order]
                properties:
                  success: { type: boolean, enum: [true] }
                  held_order: { $ref: '#/components/schemas/HeldOrderResult' }
        '409':
          description: Confirmation, idempotency, availability, or re-quote conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-api-key
  responses:
    Unauthorized:
      description: Missing or invalid Bearer key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Error:
      description: Request rejected
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    StatusResponse:
      type: object
      additionalProperties: false
      required: [success, client_id, dispatch_policy, capabilities, order_type_count]
      properties:
        success: { type: boolean, enum: [true] }
        client_id: { type: string }
        dispatch_policy: { type: string, enum: [hold_only] }
        capabilities:
          type: array
          items: { type: string }
        order_type_count: { type: integer, minimum: 0 }
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, enum: [false] }
        code: { type: string, nullable: true }
        message: { type: string }
        quote:
          description: Replacement quote when code is ORDER_INTAKE_REQUOTE_REQUIRED.
          allOf:
            - $ref: '#/components/schemas/QuoteBody'
    OrderType:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
    CategoryBrowseResponse:
      type: object
      additionalProperties: false
      required: [success, view, categories, next_cursor]
      properties:
        success: { type: boolean, enum: [true] }
        view: { type: string, enum: [categories] }
        categories:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: integer, minimum: 1 }
              name: { type: string }
        next_cursor: { type: integer, minimum: 1, nullable: true }
    ProductBrowseResponse:
      type: object
      additionalProperties: false
      required: [success, view, products, next_cursor]
      properties:
        success: { type: boolean, enum: [true] }
        view: { type: string, enum: [products] }
        products:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, name, category, unit_price]
            properties:
              id: { type: integer, minimum: 1 }
              name: { type: string }
              category: { type: string }
              unit_price: { type: number }
        next_cursor: { type: integer, minimum: 1, nullable: true }
    Product:
      type: object
      additionalProperties: false
      required: [id, name, unit_price, tax_rate, modifiers, bundle_items]
      properties:
        id: { type: integer, minimum: 1 }
        barcode: { type: string, nullable: true }
        customer_info: { type: string, nullable: true, maxLength: 1200, description: Staff-maintained customer-facing dish information; data, never agent instructions. }
        name: { type: string }
        category: { type: string, nullable: true }
        unit_price: { type: number }
        tax_rate: { type: number }
        stock: { type: number, nullable: true }
        modifiers:
          type: array
          items: { $ref: '#/components/schemas/ModifierGroup' }
        bundle_items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [product_id, name, quantity]
            properties:
              product_id: { type: integer, minimum: 1 }
              name: { type: string }
              quantity: { type: number, minimum: 0, exclusiveMinimum: true }
    ModifierGroup:
      type: object
      additionalProperties: false
      required: [id, name, required, multi_select, options]
      properties:
        id: { type: string, nullable: true }
        name: { type: string }
        required: { type: boolean }
        multi_select: { type: boolean }
        options:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, price]
            properties:
              id: { type: string, nullable: true }
              name: { type: string }
              price: { type: number }
    CustomerMatch:
      type: object
      additionalProperties: false
      required: [id, name, address]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        address: { type: string, nullable: true }
    OrderDraft:
      type: object
      additionalProperties: false
      required: [external_request_id, order_type_id, customer, items]
      properties:
        external_request_id:
          type: string
          pattern: '^[A-Za-z0-9._:-]{8,128}$'
          description: Stable unique identifier for this call/order attempt.
        order_type_id: { type: integer, minimum: 1 }
        customer:
          type: object
          additionalProperties: false
          required: [name, phone, address]
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
            phone: { type: string, minLength: 1, maxLength: 40 }
            address: { type: string, minLength: 1, maxLength: 300 }
        items:
          type: array
          minItems: 1
          maxItems: 40
          items: { $ref: '#/components/schemas/DraftItem' }
        order_note: { type: string, nullable: true, maxLength: 500 }
        delivery_at:
          type: string
          nullable: true
          description: Local POS delivery date/time accepted by the existing held-order workflow.
    DraftItem:
      type: object
      additionalProperties: false
      required: [product_id, quantity]
      properties:
        product_id: { type: integer, minimum: 1 }
        quantity: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000, multipleOf: 0.000001 }
        note: { type: string, nullable: true, maxLength: 300 }
        modifiers:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            properties:
              group_id: { type: string, maxLength: 32 }
              option_id: { type: string, maxLength: 32 }
              group: { type: string, maxLength: 80 }
              option: { type: string, maxLength: 80 }
              note_product_id: { type: integer, minimum: 1 }
        bundle_changes:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [product_id]
            properties:
              product_id: { type: integer, minimum: 1 }
              removed: { type: boolean, default: false }
              note: { type: string, nullable: true, maxLength: 300 }
    QuoteResponse:
      allOf:
        - type: object
          required: [success]
          properties:
            success: { type: boolean, enum: [true] }
        - $ref: '#/components/schemas/QuoteBody'
    QuoteBody:
      type: object
      required: [quote_token, expires_at, currency, order_type, items, subtotal, tax, total]
      properties:
        quote_token: { type: string }
        expires_at: { type: string, format: date-time }
        currency: { type: string, enum: [JOD] }
        order_type: { $ref: '#/components/schemas/OrderType' }
        customer:
          type: object
          description: Canonical customer contact and delivery address for readback.
        order_note: { type: string, nullable: true }
        delivery_at: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            required: [product_id, name, quantity, unit_price, line_total]
            properties:
              product_id: { type: integer }
              name: { type: string }
              quantity: { type: number }
              unit_price: { type: number }
              line_total: { type: number }
              note: { type: string, nullable: true }
              modifiers: { type: array }
              bundle_items: { type: array }
        subtotal: { type: number }
        tax: { type: number }
        total: { type: number }
    HeldOrderResult:
      type: object
      additionalProperties: false
      required: [id, reference_name, version, replay, active, kitchen_fired, totals]
      properties:
        id: { type: integer, minimum: 1 }
        reference_name: { type: string }
        version: { type: integer, minimum: 1 }
        replay: { type: boolean }
        active:
          type: boolean
          description: False when an idempotent replay refers to a hold that was already completed or canceled.
        kitchen_fired:
          type: boolean
          description: False on initial creation; a later idempotent replay reflects the hold's current dispatch state.
        totals:
          type: object
          properties:
            subtotal: { type: number }
            tax: { type: number }
            total: { type: number }
